<div class="policy-mgmt-page-container" style="padding: 20px;">
  <div class="page-body">
    <div class="page-header">
      <div>
        <h1>Policy Management</h1>
        <p>Upload, edit, approve, and archive government policies</p>
      </div>
      <button class="btn-primary btn-upload" (click)="toggleForm()">{{ showForm ? '✕ Close' : '+ Upload Policy' }}</button>
    </div>

    <p *ngIf="error" class="error-msg">{{ error }}</p>

    <div class="card form-card" *ngIf="showForm">
      <h3>New Policy</h3>
      <div class="form-grid">
        <div class="field-group">
          <label>Policy Title</label>
          <input type="text" [(ngModel)]="newPolicy.title" placeholder="e.g. Digital India 4.0" />
        </div>
        <div class="field-group">
          <label>Category</label>
          <select [(ngModel)]="newPolicy.category">
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div class="field-group">
          <label>Ministry</label>
          <input type="text" [(ngModel)]="newPolicy.ministry" placeholder="e.g. MeitY" />
        </div>
      </div>
      <div class="field-group">
        <label>Summary</label>
        <textarea rows="3" [(ngModel)]="newPolicy.summary" placeholder="Brief description of the policy..."></textarea>
      </div>
      <button class="btn-primary btn-upload" (click)="addPolicy()">Save Policy</button>
    </div>

    <div class="card">
      <p *ngIf="loading">Loading policies...</p>
      <table class="admin-table" *ngIf="!loading">
        <thead>
          <tr><th>Policy Name</th><th>Category</th><th>Ministry</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of policies">
            <td>{{ p.title }}</td>
            <td><span class="tag">{{ p.category }}</span></td>
            <td>{{ p.ministry }}</td>
            <td><span class="status-pill" [class]="'pill-' + p.status.toLowerCase()">{{ p.status }}</span></td>
            <td class="action-cell">
              <button class="btn-small btn-success" *ngIf="p.status !== 'Active'" (click)="approve(p)">✓ Approve</button>
              <button class="btn-small btn-warning" *ngIf="p.status !== 'Archived'" (click)="reject(p)">✕ Reject</button>
              <button class="btn-small btn-danger" (click)="deletePolicy(p)">🗑 Delete</button>
            </td>
          </tr>
          <tr *ngIf="policies.length === 0">
            <td colspan="5">No policies found. Create one using the Upload button.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
