<div class="dashboard-shell">

  <nav class="top-navbar">
    <div class="nav-logo"><img src="logo.png" alt="logo" /></div>
    <div class="nav-links">
      <a routerLink="/admin-dashboard" class="nav-link">Dashboard</a>
      <a routerLink="/policy-search" class="nav-link">Policy Search</a>
      <a routerLink="/policy-detail" class="nav-link">Policy Detail</a>
      <a routerLink="/eligibility" class="nav-link">Eligibility Checker</a>
      <a routerLink="/comparison" class="nav-link">Comparison</a>
      <a routerLink="/admin-dashboard" class="nav-link active">Admin Dashboard</a>
    </div>
    <a (click)="onLogout()" class="nav-logout" style="cursor: pointer;">⏻ Logout</a>
  </nav>

  <div class="page-body">
    <div class="page-header">
      <div>
        <h1>Policy Management</h1>
        <p>Upload, edit, approve, and archive government policies</p>
      </div>
      <button class="btn-primary" (click)="toggleForm()">{{ showForm ? '✕ Close' : '+ Upload Policy' }}</button>
    </div>

    <div class="card form-card" *ngIf="showForm">
      <h3>New Policy</h3>
      <div class="form-grid">
        <div class="field-group">
          <label>Policy Name</label>
          <input type="text" [(ngModel)]="newPolicy.name" placeholder="e.g. Digital India 4.0" />
        </div>
        <div class="field-group">
          <label>Category</label>
          <select [(ngModel)]="newPolicy.category">
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div class="field-group">
          <label>Ministry</label>
          <input type="text" [(ngModel)]="newPolicy.ministry" placeholder="e.g. MeitY" />
        </div>
      </div>
      <div class="field-group">
        <label>Description</label>
        <textarea rows="3" [(ngModel)]="newPolicy.description" placeholder="Brief description of the policy..."></textarea>
      </div>
      <button class="btn-primary" (click)="addPolicy()">Save Policy</button>
    </div>

    <div class="card">
      <table class="admin-table">
        <thead>
          <tr><th>Policy Name</th><th>Category</th><th>Ministry</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of policies">
            <td>{{ p.name }}</td>
            <td><span class="tag">{{ p.category }}</span></td>
            <td>{{ p.ministry }}</td>
            <td><span class="status-pill" [class]="'pill-' + p.status.toLowerCase()">{{ p.status }}</span></td>
            <td class="action-cell">
              <button class="btn-small" *ngIf="p.status !== 'Approved'" (click)="approve(p)">Approve</button>
              <button class="btn-small btn-danger" (click)="archive(p)">Archive</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
