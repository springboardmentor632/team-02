<div class="dashboard-shell">

  <nav class="top-navbar">
    <div class="nav-logo"><img src="logo.png" alt="logo" /></div>
    <div class="nav-links">
      <a routerLink="/admin-dashboard" class="nav-link">Dashboard</a>
      <a routerLink="/policy-search" class="nav-link">Policy Search</a>
      <a routerLink="/policy-detail" class="nav-link">Policy Detail</a>
      <a routerLink="/eligibility" class="nav-link">Eligibility Checker</a>
      <a routerLink="/comparison" class="nav-link">Comparison</a>
      <a routerLink="/admin-dashboard" class="nav-link active">Admin Dashboard</a>
    </div>
    <a (click)="onLogout()" class="nav-logout" style="cursor: pointer;">⏻ Logout</a>
  </nav>

  <div class="page-body">
    <div class="page-header">
      <div>
        <h1>Scheme Management</h1>
        <p>Register, update, and manage public welfare schemes</p>
      </div>
      <button class="btn-primary" (click)="toggleForm()">{{ showForm ? '✕ Close' : '+ Register Scheme' }}</button>
    </div>

    <div class="card form-card" *ngIf="showForm">
      <h3>New Scheme</h3>
      <div class="form-grid">
        <div class="field-group">
          <label>Scheme Name</label>
          <input type="text" [(ngModel)]="newScheme.name" placeholder="e.g. Startup India Seed Fund" />
        </div>
        <div class="field-group">
          <label>Category</label>
          <select [(ngModel)]="newScheme.category">
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div class="field-group">
          <label>Benefit</label>
          <input type="text" [(ngModel)]="newScheme.benefit" placeholder="e.g. Up to ₹20 lakh" />
        </div>
      </div>
      <button class="btn-primary" (click)="addScheme()">Save Scheme</button>
    </div>

    <div class="card">
      <table class="admin-table">
        <thead>
          <tr><th>Scheme Name</th><th>Category</th><th>Benefit</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of schemes">
            <td>{{ s.name }}</td>
            <td><span class="tag">{{ s.category }}</span></td>
            <td>{{ s.benefit }}</td>
            <td><span class="status-pill" [class]="'pill-' + s.status.toLowerCase()">{{ s.status }}</span></td>
            <td class="action-cell">
              <button class="btn-small" *ngIf="s.status !== 'Active'" (click)="activate(s)">Activate</button>
              <button class="btn-small btn-danger" (click)="archive(s)">Archive</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
