<div class="scheme-mgmt-page-container" style="padding: 20px;">
  <div class="page-body">
    <div class="page-header">
      <div>
        <h1>Scheme Management</h1>
        <p>Register, manage, and activate public welfare schemes</p>
      </div>
      <button class="btn-primary btn-upload" (click)="toggleForm()">{{ showForm ? '✕ Close' : '+ Add Scheme' }}</button>
    </div>

    <p *ngIf="error" class="error-msg">{{ error }}</p>

    <div class="card form-card" *ngIf="showForm">
      <h3>New Scheme</h3>
      <div class="form-grid">
        <div class="field-group">
          <label>Scheme Name</label>
          <input type="text" [(ngModel)]="newScheme.name" placeholder="e.g. PM Kisan" />
        </div>
        <div class="field-group">
          <label>Category</label>
          <select [(ngModel)]="newScheme.category">
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div class="field-group">
          <label>Ministry</label>
          <input type="text" [(ngModel)]="newScheme.ministry" placeholder="e.g. Ministry of Agriculture" />
        </div>
        <div class="field-group">
          <label>Key Benefit</label>
          <input type="text" [(ngModel)]="newScheme.benefit" placeholder="e.g. ₹6,000/year" />
        </div>
      </div>
      <div class="field-group">
        <label>Summary</label>
        <textarea rows="2" [(ngModel)]="newScheme.summary" placeholder="Brief description..."></textarea>
      </div>
     <button class="btn-primary btn-upload" (click)="addScheme()">Save Scheme</button>
    </div>

    <div class="card">
      <p *ngIf="loading">Loading schemes...</p>
      <table class="admin-table" *ngIf="!loading">
        <thead>
          <tr><th>Scheme Name</th><th>Category</th><th>Benefit</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of schemes">
            <td>{{ s.name }}</td>
            <td><span class="tag">{{ s.category }}</span></td>
            <td>{{ s.benefits?.[0] || s.summary }}</td>
            <td><span class="status-pill" [class]="'pill-' + s.status.toLowerCase()">{{ s.status }}</span></td>
            <td class="action-cell">
              <button class="btn-small btn-success" *ngIf="s.status !== 'Active'" (click)="approve(s)">✓ Approve</button>
              <button class="btn-small btn-warning" *ngIf="s.status !== 'Archived'" (click)="reject(s)">✕ Reject</button>
              <button class="btn-small btn-danger" (click)="deleteScheme(s)">🗑 Delete</button>
            </td>
          </tr>
          <tr *ngIf="schemes.length === 0">
            <td colspan="5">No schemes found. Create one using the Add button.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
