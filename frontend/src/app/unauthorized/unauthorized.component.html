<div class="unauth-shell">
  <div class="unauth-card">
    <div class="icon-circle">🚫</div>
    <h1>Access Denied</h1>
    <p class="subtitle">You do not have permission to view this page.</p>
    <p class="hint">This area is restricted to a different role. Please navigate to your own workspace.</p>
    <div class="btn-group">
      <button class="btn-primary" (click)="goToDashboard()">Go to My Dashboard</button>
      <button class="btn-outline" (click)="goToLogin()">Back to Login</button>
    </div>
  </div>
</div>
