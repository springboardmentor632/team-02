<div class="comparison-page-container">
  <div class="page-body">
    <div class="page-header">
      <div>
        <h1>Notifications</h1>
        <p>Stay updated on policies, schemes, and application status</p>
      </div>
      <button class="btn-outline" (click)="markAllAsRead()" *ngIf="unreadCount > 0">Mark all as read</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn" [class.filter-active]="filter === 'all'" (click)="setFilter('all')">All ({{ notifications.length }})</button>
      <button class="filter-btn" [class.filter-active]="filter === 'unread'" (click)="setFilter('unread')">Unread ({{ unreadCount }})</button>
    </div>

    <div class="empty-state" *ngIf="filteredNotifications.length === 0">
      <p>No notifications to show.</p>
    </div>

    <div class="notif-list">
      <div class="notif-item" *ngFor="let n of filteredNotifications" [class.notif-unread]="!n.read" (click)="markAsRead(n)">
        <span class="notif-icon">{{ iconFor(n.type) }}</span>
        <div class="notif-body">
          <div class="notif-top">
            <h4>{{ n.title }}</h4>
            <span class="notif-time">{{ formatTime(n.sentAt) }}</span>
          </div>
          <p>{{ n.message }}</p>
        </div>
        <span class="unread-dot" *ngIf="!n.read"></span>
      </div>
    </div>
  </div>
</div>
