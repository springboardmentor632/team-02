<div class="dashboard-page">
  <div class="content-header">
    <div>
      <h1>Admin Dashboard</h1>
      <p>Platform-wide overview · Data as of July 2026</p>
    </div>
    <div class="header-actions">
      <button class="btn-outline" routerLink="/admin/reports">⬇ Export Reports</button>
      <button class="btn-primary" routerLink="/admin/policies">+ Add Policy</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card" *ngFor="let s of stats">
      <span class="stat-value">{{ s.value }}</span>
      <p class="stat-label">{{ s.label }}</p>
      <p class="stat-sub" [class.stat-danger]="s.danger">{{ s.sub }}</p>
    </div>
  </div>

  <div class="content-grid">
    <div class="card">
      <h3>User Registrations by Role</h3>
      <div class="role-row" *ngFor="let r of roleStats">
        <div class="role-top">
          <span>{{ r.role }}</span>
          <span>{{ r.count }}</span>
        </div>
        <div class="role-bar-bg">
          <div class="role-bar-fill" [style.width.%]="r.percent"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Recent Policy Submissions</h3>
      <table class="admin-table">
        <thead>
          <tr><th>Policy Name</th><th>Ministry</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of submissions">
            <td>{{ p.name }}</td>
            <td>{{ p.ministry }}</td>
            <td>
              <span class="status-pill" [class]="'pill-' + p.status.toLowerCase()">{{ p.status }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
