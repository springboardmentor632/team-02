<div class="comparison-page-container">
  <div class="page-body">
    <div class="page-header">
      <div>
        <h1>Reports Dashboard</h1>
        <p>Generate and download policy, scheme, and activity reports</p>
      </div>
      <button class="btn-primary" (click)="generateNewReport()" [disabled]="generating">
        <span *ngIf="!generating">+ Generate New Report</span>
        <span *ngIf="generating">Generating...</span>
      </button>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn" *ngFor="let cat of categories" [class.filter-active]="selectedCategory === cat" (click)="setCategory(cat)">
        {{ cat }}
      </button>
    </div>

    <div class="card">
      <p *ngIf="loading">Loading reports...</p>
      <table class="report-table" *ngIf="!loading && filteredReports.length > 0">
        <thead>
          <tr><th>Report Name</th><th>Category</th><th>Summary</th><th>Generated On</th><th>Format</th><th></th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of filteredReports">
            <td>{{ r.name }}</td>
            <td><span class="scheme-badge">{{ r.category }}</span></td>
            <td>{{ r.value }}</td>
            <td>{{ r.generatedOn }}</td>
            <td>{{ r.format }}</td>
            <td><button class="btn-outline btn-sm" (click)="downloadReport(r)">Download</button></td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" *ngIf="!loading && filteredReports.length === 0">
        <p>No reports found for this category.</p>
      </div>
    </div>
  </div>
</div>
