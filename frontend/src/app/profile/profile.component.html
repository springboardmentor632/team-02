<div class="dashboard-shell">

  <nav class="top-navbar">
    <div class="nav-logo"><img src="logo.png" alt="logo" /></div>
    <div class="nav-links">
      <a routerLink="/dashboard" class="nav-link">Dashboard</a>
      <a routerLink="/policy-search" class="nav-link">Policy Search</a>
      <a routerLink="/policy-detail" class="nav-link">Policy Detail</a>
      <a routerLink="/eligibility" class="nav-link">Eligibility Checker</a>
      <a routerLink="/comparison" class="nav-link">Comparison</a>
      <a routerLink="/admin-dashboard" class="nav-link">Admin Dashboard</a>
      <a routerLink="/feedback" class="nav-link">feedback</a>
    </div>
    <a routerLink="/login" class="nav-logout">⏻ Logout</a>
  </nav>

  <div class="page-body">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>Manage your personal information and preferences</p>
    </div>

    <div class="profile-grid">
      <div class="card profile-summary">
        <div class="avatar-large">RS</div>
        <h3>{{ fullName }}</h3>
        <p>{{ role }} · {{ state }}</p>
      </div>

      <div class="card profile-form">
        <h3>Edit Details</h3>
        <div *ngIf="saved" class="success-banner">Profile updated successfully!</div>

        <div class="form-grid">
          <div class="field-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="fullName" />
          </div>
          <div class="field-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="email" />
          </div>
          <div class="field-group">
            <label>Phone Number</label>
            <input type="text" [(ngModel)]="phone" />
          </div>
          <div class="field-group">
            <label>Role</label>
            <select [(ngModel)]="role">
              <option>Citizen</option>
              <option>Government Official</option>
              <option>Researcher</option>
              <option>Organisation</option>
            </select>
          </div>
          <div class="field-group">
            <label>State</label>
            <input type="text" [(ngModel)]="state" />
          </div>
        </div>

        <button class="btn-primary" (click)="onSave()" [disabled]="saving">
          <span *ngIf="!saving">Save Changes</span>
          <span *ngIf="saving">Saving...</span>
        </button>
      </div>
    </div>
  </div>
</div>
