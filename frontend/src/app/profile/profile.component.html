<div class="profile-page-container" style="padding: 20px; background-color: #f8f9fa;">
  <div class="page-body">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>Manage your personal information and preferences</p>
    </div>

    <div class="profile-grid">
      <div class="card profile-summary">
        <div class="avatar-large">{{ firstName.charAt(0) }}{{ lastName.charAt(0) }}</div>
        <h3>{{ firstName }} {{ lastName }}</h3>
        <p>{{ role }}</p>
      </div>

      <div class="card profile-form">
        <h3>Edit Details</h3>
        <div *ngIf="saved" class="success-banner">Profile updated successfully!</div>
        <div *ngIf="error" class="error-msg">{{ error }}</div>

        <div class="form-grid">
          <div class="field-group">
            <label>First Name</label>
            <input type="text" [(ngModel)]="firstName" />
          </div>
          <div class="field-group">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="lastName" />
          </div>
          <div class="field-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="email" disabled />
          </div>
          <div class="field-group">
            <label>Phone Number</label>
            <input type="text" [(ngModel)]="phone" />
          </div>
          <div class="field-group">
            <label>Role</label>
            <input type="text" [(ngModel)]="role" disabled />
          </div>
          <div class="field-group">
            <label>Organization</label>
            <input type="text" [(ngModel)]="organization" />
          </div>
        </div>

        <button class="btn-primary" (click)="onSave()" [disabled]="saving">
          <span *ngIf="!saving">Save Changes</span>
          <span *ngIf="saving">Saving...</span>
        </button>
      </div>
    </div>
  </div>
</div>
